[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nuberu_plugin_example_custom"
version = "0.1.0"
description = "Example Custom Plugin for nuberu"
authors = [{ name = "Nuberu Team", email = "info@nuberu.io" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "nuberu",
]

[tool.uv.sources]
nuberu = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."nuberu"]
"custom.custom_example" = "nuberu_plugin_example_custom.plugin:ExampleCustomPlugin"
