[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nuberu_plugin_cost_spot"
version = "0.3.0"
description = "Spot CostModel plugin for nuberu"
authors = [{ name = "Ruben", email = "luqueruben@uniovi.es" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "nuberu",
]

[tool.uv.sources]
nuberu = { workspace = true }


[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."nuberu"]
"cost_model.spot" = "nuberu_plugin_cost_spot.plugin:SpotCostModelPlugin"

